<svg width="1200" height="860" viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Geist Sans', sans-serif">
  <defs>
    <linearGradient id="bb-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6446F5"/><stop offset="0.5" stop-color="#4388F5"/><stop offset="1" stop-color="#FF9A43"/>
    </linearGradient>
    <linearGradient id="bb-arrow" x1="0.1" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6446F5"/><stop offset="0.45" stop-color="#4388F5"/><stop offset="0.82" stop-color="#FF9A43"/><stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
    <linearGradient id="bb-fold" x1="0.3" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#5B3EF0"/><stop offset="1" stop-color="#FF8A3A"/></linearGradient>
    <linearGradient id="bb-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFBFE"/><stop offset="1" stop-color="#EEF0F7"/></linearGradient>
    <radialGradient id="bb-glow" cx="50%" cy="80%" r="55%"><stop offset="0" stop-color="#FF9A43" stop-opacity="0.5"/><stop offset="0.6" stop-color="#6446F5" stop-opacity="0.16"/><stop offset="1" stop-color="#6446F5" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="860" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="56" y="66" font-size="30" font-weight="700" fill="#171923" letter-spacing="-0.5">Builder Compass — Design System</text>
  <text x="56" y="94" font-size="15" fill="#777B89">Premium, minimal, developer-focused. Inspired by Apple, Linear, Raycast, Vercel.</text>
  <line x1="56" y1="116" x2="1144" y2="116" stroke="#EDEEF3"/>

  <!-- Logo lockup -->
  <g transform="translate(56,148)">
    <rect width="1088" height="168" rx="16" fill="#F6F7FA" stroke="#EDEEF3"/>
    <!-- icon -->
    <g transform="translate(40,34)">
      <rect width="100" height="100" rx="28" fill="url(#bb-tile)" stroke="#E7E9F2"/>
      <rect x="7" y="7" width="86" height="86" rx="23" fill="url(#bb-glow)"/>
      <g transform="translate(50,50)">
        <path d="M 25 -25 L -22 -2 L -2 7 L 7 27 Z" fill="url(#bb-arrow)"/>
        <path d="M -2 7 L 7 27 L 9 2 Z" fill="url(#bb-fold)"/>
      </g>
    </g>
    <text x="170" y="98" font-size="46" font-weight="700" fill="#171923" letter-spacing="-1.2">Builder</text>
    <text x="368" y="98" font-size="46" font-weight="500" fill="#777B89" letter-spacing="-1.2">Compass</text>
    <text x="760" y="70" font-size="13" fill="#777B89">App icon · wordmark ·</text>
    <text x="760" y="92" font-size="13" fill="#777B89">monochrome fallback</text>
    <!-- mono mark -->
    <g transform="translate(980,84)"><rect x="-32" y="-34" width="68" height="68" rx="18" fill="#171923"/><g transform="translate(2,0)"><path d="M 16 -16 L -14 -1 L -1 4 L 4 17 Z" fill="#FFFFFF"/></g></g>
  </g>

  <!-- Palette -->
  <text x="56" y="360" font-size="17" font-weight="600" fill="#171923">Colour tokens</text>
  <g font-size="11.5">
    <!-- row of swatches -->
    <g transform="translate(56,378)">
      <g><rect width="128" height="76" rx="12" fill="#6446F5"/><text x="0" y="98" fill="#171923" font-weight="600">Primary purple</text><text x="0" y="114" fill="#777B89" font-family="'Geist Mono',monospace">#6446F5</text></g>
      <g transform="translate(148,0)"><rect width="128" height="76" rx="12" fill="#4388F5"/><text x="0" y="98" fill="#171923" font-weight="600">Secondary blue</text><text x="0" y="114" fill="#777B89" font-family="'Geist Mono',monospace">#4388F5</text></g>
      <g transform="translate(296,0)"><rect width="128" height="76" rx="12" fill="#FF9A43"/><text x="0" y="98" fill="#171923" font-weight="600">Accent orange</text><text x="0" y="114" fill="#777B89" font-family="'Geist Mono',monospace">#FF9A43</text></g>
      <g transform="translate(444,0)"><rect width="128" height="76" rx="12" fill="#16A36A"/><text x="0" y="98" fill="#171923" font-weight="600">Success</text><text x="0" y="114" fill="#777B89" font-family="'Geist Mono',monospace">#16A36A</text></g>
      <g transform="translate(592,0)"><rect width="128" height="76" rx="12" fill="#D97706"/><text x="0" y="98" fill="#171923" font-weight="600">Warning</text><text x="0" y="114" fill="#777B89" font-family="'Geist Mono',monospace">#D97706</text></g>
      <g transform="translate(740,0)"><rect width="128" height="76" rx="12" fill="#DC5555"/><text x="0" y="98" fill="#171923" font-weight="600">Error</text><text x="0" y="114" fill="#777B89" font-family="'Geist Mono',monospace">#DC5555</text></g>
      <g transform="translate(888,0)"><rect width="128" height="76" rx="12" fill="url(#bb-brand)"/><text x="0" y="98" fill="#171923" font-weight="600">Brand gradient</text><text x="0" y="114" fill="#777B89" font-family="'Geist Mono',monospace">purple→blue→orange</text></g>
    </g>
    <!-- neutrals -->
    <g transform="translate(56,520)">
      <g><rect width="128" height="56" rx="12" fill="#171923"/><text x="0" y="78" fill="#171923" font-weight="600">Text</text><text x="0" y="94" fill="#777B89" font-family="'Geist Mono',monospace">#171923</text></g>
      <g transform="translate(148,0)"><rect width="128" height="56" rx="12" fill="#777B89"/><text x="0" y="78" fill="#171923" font-weight="600">Muted text</text><text x="0" y="94" fill="#777B89" font-family="'Geist Mono',monospace">#777B89</text></g>
      <g transform="translate(296,0)"><rect width="128" height="56" rx="12" fill="#F6F7FA" stroke="#EDEEF3"/><text x="0" y="78" fill="#171923" font-weight="600">Secondary bg</text><text x="0" y="94" fill="#777B89" font-family="'Geist Mono',monospace">#F6F7FA</text></g>
      <g transform="translate(444,0)"><rect width="128" height="56" rx="12" fill="#FFFFFF" stroke="#EDEEF3"/><text x="0" y="78" fill="#171923" font-weight="600">Background</text><text x="0" y="94" fill="#777B89" font-family="'Geist Mono',monospace">#FFFFFF</text></g>
    </g>
  </g>
  <text x="56" y="626" font-size="12.5" fill="#777B89">Gradient used sparingly — selected states, branding, and highlights only. Semantic colours (success/warning/error) carry meaning, never decoration.</text>

  <!-- Typography -->
  <text x="56" y="668" font-size="17" font-weight="600" fill="#171923">Typography</text>
  <text x="56" y="712" font-size="38" font-weight="700" fill="#171923" letter-spacing="-1">Inter / Geist Sans — the interface</text>
  <text x="56" y="744" font-size="16" fill="#171923">Clear hierarchy, generous whitespace. Body 16px, line-height 1.6.</text>
  <text x="56" y="774" font-size="15" fill="#777B89" font-family="'Geist Mono',monospace">Geist Mono — DEV301 · 13:00–14:00 · Venetian · 18 min walk</text>

  <!-- Component chips -->
  <g transform="translate(56,796)">
    <rect width="150" height="40" rx="12" fill="url(#bb-brand)"/><text x="30" y="25" font-size="14" font-weight="600" fill="#fff">Add to stack</text>
    <rect x="166" y="0" width="150" height="40" rx="12" fill="#FFFFFF" stroke="#E2E4EC"/><text x="196" y="25" font-size="14" font-weight="500" fill="#171923">Secondary</text>
    <rect x="332" y="0" width="118" height="40" rx="12" fill="#F0ECFE"/><text x="356" y="25" font-size="14" font-weight="600" fill="#6446F5">Selected</text>
    <rect x="466" y="8" width="120" height="24" rx="12" fill="#E7F6EF"/><circle cx="484" cy="20" r="4" fill="#16A36A"/><text x="496" y="24" font-size="12" fill="#0F7A4F">Reachable</text>
    <rect x="602" y="8" width="96" height="24" rx="12" fill="#FBF0DD"/><circle cx="620" cy="20" r="4" fill="#D97706"/><text x="632" y="24" font-size="12" fill="#9A5B07">Tight</text>
    <rect x="714" y="8" width="128" height="24" rx="12" fill="#FBE9E9"/><circle cx="732" cy="20" r="4" fill="#DC5555"/><text x="744" y="24" font-size="12" fill="#B23636">Not reachable</text>
  </g>
</svg>
