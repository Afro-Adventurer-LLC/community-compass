<svg width="680" height="180" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Builder Compass">
  <defs>
    <!-- Brand gradient: purple -> blue -> orange -->
    <linearGradient id="bc-arrow" x1="0.1" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6446F5"/>
      <stop offset="0.45" stop-color="#4388F5"/>
      <stop offset="0.82" stop-color="#FF9A43"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
    <linearGradient id="bc-arrow-fold" x1="0.3" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5B3EF0"/>
      <stop offset="1" stop-color="#FF8A3A"/>
    </linearGradient>
    <!-- squircle tile -->
    <linearGradient id="bc-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFBFE"/>
      <stop offset="1" stop-color="#EEF0F7"/>
    </linearGradient>
    <radialGradient id="bc-glow" cx="50%" cy="80%" r="55%">
      <stop offset="0" stop-color="#FF9A43" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6446F5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6446F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon tile -->
  <g transform="translate(20,30)">
    <!-- soft squircle -->
    <rect x="0" y="0" width="120" height="120" rx="34" fill="url(#bc-tile)" stroke="#E7E9F2" stroke-width="1"/>
    <!-- inner glow pooling at the arrow tail -->
    <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bc-glow)"/>
    <!-- navigation arrow / paper plane -->
    <g transform="translate(60,60)">
      <!-- main blade -->
      <path d="M 30 -30 L -26 -2 L -2 8 L 8 32 Z" fill="url(#bc-arrow)"/>
      <!-- folded underside (darker) for the paper-plane crease -->
      <path d="M -2 8 L 8 32 L 11 2 Z" fill="url(#bc-arrow-fold)"/>
      <!-- bright edge highlight -->
      <path d="M 30 -30 L -26 -2 L -2 8 Z" fill="#FFFFFF" opacity="0.12"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(168,0)">
    <text x="0" y="108" font-family="Inter, 'Geist Sans', sans-serif" font-size="56" font-weight="700" fill="#171923" letter-spacing="-1.5">Builder</text>
    <text x="236" y="108" font-family="Inter, 'Geist Sans', sans-serif" font-size="56" font-weight="500" fill="#777B89" letter-spacing="-1.5">Compass</text>
  </g>
</svg>
